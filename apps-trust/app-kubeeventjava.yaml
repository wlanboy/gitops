apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeeventjava
  namespace: argocd
spec:
  project: wlanboy

  source:
    repoURL: https://github.com/wlanboy/kubeeventjava.git
    targetRevision: main
    path: kubeeventjava-chart
    helm:
      releaseName: kubeeventjava
      valueFiles:
        - values.yaml
      valuesObject:
        extraVolumeMounts:
          - name: trust
            mountPath: /opt/trust
        extraVolumes:
          - name: trust
            secret:
              secretName: gmk-truststore
        extraEnv:
          - name: JAVA_TOOL_OPTIONS
            value: "-Djavax.net.ssl.trustStore=/opt/trust/gmk-truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit"

  destination:
    name: gmk
    namespace: kubeeventjava

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
